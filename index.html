</head>

<body>
    <script>
      try {
        const session = JSON.parse(localStorage.getItem('authSession'));
        if (!session || Date.now() > session.expiresAt) {
          window.location.href = 'login.html';
        }
      } catch (e) {
        window.location.href = 'login.html';
      }
    </script>

    <!-- NAVBAR -->
    <header class="navbar">
    <a href="/index.html" class="navbar-logo" aria-label="Ir para a pagina inicial">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 18V8.5L12 4l8 4.5V18" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 18v-6h8v6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="wordmark">Gu<span>Ra</span></div>
    </a>
 
    <nav class="navbar-menu">
      <a href="/index.html">Início</a>
      <a href="/index.html#noticias">Notícias</a>
      <a href="/gerenciador-grade.html">Grade</a>
      <a href="/notas-professores.html">Professores</a>
    </nav>
 
    <div class="navbar-right">
      <button class="navbar-lang" id="logout-btn" type="button" aria-label="Sair da conta">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9Z" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <span class="lang-label">Sair</span>
      </button>
 
      <div class="navbar-divider"></div>
 
      <div class="navbar-profile">
        <div class="profile-picture">
          TS
          <button type="button" id="profile-btn" aria-label="Abrir menu de perfil"></button>
        </div>
      </div>
    </div>
  </header>

    <div class="modal-overlay" id="modalProfile">
    <div class="modal-profile">
      <div class="modal-conteudo">
        <div class="modal-close">
          <button type="button" class="close-btn" id="closeBtn" aria-label="Fechar">&times;</button>
        </div>
        <h2>Opções de perfil</h2>
        <form id="profileForm">
          <label for="Sexo">Sexo:</label>
          <select id="Sexo" name="Sexo">
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
          </select>
          <label for="Curso">Curso:</label>
          <select id="Curso" name="Curso">
            <option value="eng_comp">Eng. Comp</option>
            <option value="eng_prod">Eng. Produção</option>
            <option value="economia">Economia</option>
            <option value="eng_quimica">Eng. Química</option>
          </select>
          <label for="Turno">Turno:</label>
          <select id="Turno" name="Turno">
            <option value="matutino">Matutino</option>
            <option value="vespertino">Vespertino</option>
            <option value="integral">Integral</option>
            <option value="noturno">Noturno</option>
          </select>
          <label for="Periodo">Período:</label>
          <select id="Periodo" name="Periodo">
            <option value="1">1º</option>
            <option value="2">2º</option>
            <option value="3">3º</option>
            <option value="4">4º</option>
            <option value="5">5º</option>
            <option value="6">6º</option>
            <option value="7">7º</option>
            <option value="8">8º</option>
            <option value="9">9º</option>
            <option value="10">10º</option>
          </select>
        </form>
        <button type="button" class="save-btn" id="saveBtn">Salvar</button>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
      </div>
    </div>
  </div>
    <!-- CONTEÚDO -->
    <main>
      <!-- ÁREA DE BOAS-VINDAS -->
      <section class="main">
        <div class="welcome-column">
          <div class="welcome-box">
            <h1>Bem Vindo!</h1>
          </div>

          <div class="course-box">
            <div class="course-info" id="courseInfo">
              <h2>Resumo do Aluno</h2>
              <p id="profileMissingMessage" hidden>
                Coloque suas informações no seu perfil antes de continuar!
              </p>
              <ul class="info-lista" id="studentSummary">
              <li class="info-item">
                <span class="info-label">Curso:</span>
                <span class="info-value" id="curso"></span>
              </li>

              <li class="info-item">
                <span class="info-label">Período:</span>
                <span class="info-value" id="periodo"></span>
              </li>

              <li class="info-item">
                <span class="info-label">Turno:</span>
                <span class="info-value" id="turno"></span>
              </li>
              </ul>
            </div>
            
            <div class="news-box" id="noticias">
                <h2>Notícias</h2>
                <div class="content-box"></div>
                <div class="content-box"></div>
                <div class="content-box"></div>
            </div>
          </div>
        </div>

        </section>
        
    </main>
  </body>
</html>
