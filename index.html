<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GURA</title>

    <link rel="stylesheet" href="/src/styles/index_style.css">
    <script src="/src/services/profileModal.js" defer></script>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="navbar-logo"></div>

        <nav class="navbar-menu">
            <a href="#noticias">Notícias</a>
            <a href="#gerenciador-grade">Gerenciador de grade</a>
            <a href="/notas-professores.html">Professores</a>
        </nav>

        <div class="navbar-profile">
            <div class="profile-picture">
                <button id="profile-btn" style="position:absolute; height: 100%; width: 100%; cursor: pointer; opacity: 0;"></button>
            </div>
        </div>

    </header>


    <!-- CONTEÚDO -->
    <main>

        <!-- ÁREA DE BOAS-VINDAS -->
        <section class="main">
            <div class="welcome-column">

                <div class="welcome-box">
                    <h1>Bem Vindo!</h1>   
                </div>

                <div class="course-box">
                    <div class="course-info">
                        <h2>Resumo do Aluno</h2>
                        <div class="info-item">
                            <li class="info-label">Curso:</li>
                            <span class="info-value">Eng.Comp</span>
                        </div>

                        <div class="info-item">
                            <li class="info-label">Semestre:</li>
                            <span class="info-value">2º</span>
                        </div>

                        <div class="info-item">
                            <li class="info-label">Período:</li>
                            <span class="info-value">Integral</span>
                        </div>

                    </div>

                </div>
            </div>
            
            <div class="news-box">
                <h1>Notícias</h1>
                <div class="content-box"></div>
                <div class="content-box"></div>
                <div class="content-box"></div>
            </div>

            <div class="modal-overlay" id="modalProfile">
                <div class="modal-profile">
                    <div class="modal-conteudo">
                        <button class="close-btn" id="closeBtn">&times;</button>
                        <h2>Opções de perfil</h2>
                        <p>teste</p>
                        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

                    </div>
                </div>
            </div>
            
            
            

        </section>
        
    </main>

</body>
</html>
